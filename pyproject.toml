[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-finance"
version = "0.1.0"
description = "JAX pricing kernels for the autodiff-for-Greeks blog series: Black-76 and SABR"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.txt"]
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy>=1.24",
]

[project.optional-dependencies]
fx = ["QuantLib", "scipy>=1.10", "polars"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jax_finance*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
