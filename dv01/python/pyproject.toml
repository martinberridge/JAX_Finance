[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv01-python"
version = "0.1.0"
description = "Python port of Strata CalibrationInterpolationExample"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pv01_basics*", "pv01_loader*", "pv01_market*", "pv01_product*", "pv01_pricer*", "pv01_examples*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
